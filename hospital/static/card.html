<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meddy · Sample insurance card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700;800&display=swap">
<style>
  /* A made-up insurance card for trying the scanner at the entrance of the walk-through.
     The barcode is a real Code 39 barcode of the number printed under it. */
  :root { --page:#f3f6f2; --card:#fff; --line:#dce3dd; --ink:#16252a; --soft:#45555b; --blue:#2152c4; --blue-dark:#173f9c;
          --font:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:var(--page); color:var(--ink);
         font:400 1.125rem/1.5 var(--font); }
  main { width:100%; max-width:560px; }
  h1 { margin:0 0 6px; font-size:1.6rem; font-weight:800; letter-spacing:-0.01em; }
  p { margin:0 0 18px; color:var(--soft); }
  .plastic { padding:24px; border-radius:22px; background:var(--card); border:1px solid var(--line);
             box-shadow:0 2px 4px rgba(22,37,42,.04), 0 18px 40px -18px rgba(22,37,42,.22); }
  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; }
  .top b { font-size:1.15rem; }
  .sample { padding:4px 12px; border-radius:999px; background:#fff4e0; color:#7a4700; font-size:.9rem; font-weight:700; white-space:nowrap; }
  svg { display:block; width:100%; height:auto; background:#fff; }
  .number { margin:10px 0 0; text-align:center; font-size:1.5rem; font-weight:800; letter-spacing:.12em; color:var(--ink);
            font-variant-numeric:tabular-nums; }
  .row { display:flex; flex-wrap:wrap; gap:10px; margin-top:20px; }
  button, a.button { display:inline-flex; align-items:center; min-height:48px; padding:8px 20px; border:2px solid var(--blue);
                     border-radius:999px; background:var(--card); color:var(--blue-dark); font:700 1rem var(--font);
                     text-decoration:none; cursor:pointer; }
  button:hover, a.button:hover { background:#e8eefc; }
  button:focus-visible, a:focus-visible { outline:4px solid var(--blue); outline-offset:3px; }
  .small { margin:18px 0 0; font-size:1rem; }
</style>
</head>
<body>
<main>
  <h1>Sample insurance card</h1>
  <p>Made up, for trying Meddy's scanner. Show the barcode to the camera, or print this page.</p>
  <div class="plastic">
    <div class="top"><b>Meddy Health Insurance</b><span class="sample">Sample · not a real card</span></div>
    <svg id="barcode" role="img" aria-label="Barcode of the card number" preserveAspectRatio="none"></svg>
    <p class="number" id="number"></p>
  </div>
  <div class="row">
    <button type="button" id="another">Another made-up card</button>
    <a class="button" href="/">Back to Meddy</a>
  </div>
  <p class="small">This project is a prototype and is not medical advice.</p>
</main>
<script>
// Code 39: every character is nine stripes (bar, space, bar, …), three of them wide. "*" starts and ends the code.
const CODE39 = {
  "0":"nnnwwnwnn", "1":"wnnwnnnnw", "2":"nnwwnnnnw", "3":"wnwwnnnnn", "4":"nnnwwnnnw", "5":"wnnwwnnnn", "6":"nnwwwnnnn",
  "7":"nnnwnnwnw", "8":"wnnwnnwnn", "9":"nnwwnnwnn", "A":"wnnnnwnnw", "B":"nnwnnwnnw", "C":"wnwnnwnnn", "D":"nnnnwwnnw",
  "E":"wnnnwwnnn", "F":"nnwnwwnnn", "G":"nnnnnwwnw", "H":"wnnnnwwnn", "I":"nnwnnwwnn", "J":"nnnnwwwnn", "K":"wnnnnnnww",
  "L":"nnwnnnnww", "M":"wnwnnnnwn", "N":"nnnnwnnww", "O":"wnnnwnnwn", "P":"nnwnwnnwn", "Q":"nnnnnnwww", "R":"wnnnnnwwn",
  "S":"nnwnnnwwn", "T":"nnnnwnwwn", "U":"wwnnnnnnw", "V":"nwwnnnnnw", "W":"wwwnnnnnn", "X":"nwnnwnnnw", "Y":"wwnnwnnnn",
  "Z":"nwwnwnnnn", "*":"nwnnwnwnn",
};
function draw(number) {
  let x = 12, bars = "";                                    // a quiet zone on both sides, as scanners need
  for (const character of "*" + number + "*") {
    [...CODE39[character]].forEach((stripe, i) => {
      const width = stripe === "w" ? 3 : 1;
      if (i % 2 === 0) bars += `<rect x="${x}" y="0" width="${width}" height="60"/>`;
      x += width;
    });
    x += 1;                                                 // the narrow gap between two characters
  }
  const svg = document.getElementById("barcode");
  svg.setAttribute("viewBox", `0 0 ${x + 11} 60`);
  svg.innerHTML = `<rect width="${x + 11}" height="60" fill="#fff"/><g fill="#000">${bars}</g>`;
  document.getElementById("number").textContent = number;
}
const madeUp = () => "MD" + String(Math.floor(10000000 + Math.random() * 90000000));
const asked = new URLSearchParams(location.search).get("n") || "";
draw(/^[A-Z0-9]{6,20}$/.test(asked) ? asked : "MD48291375");
document.getElementById("another").addEventListener("click", () => draw(madeUp()));
</script>
</body>
</html>
